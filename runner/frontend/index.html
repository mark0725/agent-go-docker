<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Go Runner</title>
    <script defer src="/alpine.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        [x-cloak] { display: none !important; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f0f; color: #e0e0e0; }

        .app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; transition: grid-template-columns 0.18s ease; }
        .app.collapsed { grid-template-columns: 44px 1fr; }

        /* Sidebar */
        .sidebar { background: #1a1a2e; border-right: 1px solid #2a2a3e; display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-header {
            padding: 14px 16px; border-bottom: 1px solid #2a2a3e;
            display: flex; align-items: center; gap: 8px;
        }
        .sidebar-header h1 { font-size: 16px; font-weight: 600; color: #fff; flex: 1; white-space: nowrap; overflow: hidden; }
        .btn-toggle, .btn-new {
            background: transparent; border: 1px solid #3a3a5e; color: #ccc;
            padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        .btn-toggle:hover, .btn-new:hover { background: #2a2a3e; color: #fff; }
        .btn-new { background: #6c5ce7; border-color: #6c5ce7; color: #fff; }
        .btn-new:hover { background: #5a4bd1; }

        .collapsed .sidebar-header h1,
        .collapsed .sidebar-search,
        .collapsed .agent-list,
        .collapsed .agent-info,
        .collapsed .agent-actions { display: none; }
        .collapsed .sidebar-header { padding: 10px 4px; flex-direction: column; }
        .collapsed .btn-new { padding: 4px 6px; font-size: 12px; }

        .sidebar-search { padding: 8px 10px; border-bottom: 1px solid #2a2a3e; }
        .sidebar-search-input-wrap { position: relative; }
        .sidebar-search input {
            width: 100%; padding: 6px 26px 6px 10px; border-radius: 6px;
            border: 1px solid #3a3a5e; background: #0f0f1a; color: #e0e0e0;
            font-size: 13px; outline: none; font-family: inherit;
        }
        .sidebar-search input:focus { border-color: #6c5ce7; }
        .sidebar-search input::placeholder { color: #666; }
        .sidebar-search-clear {
            position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
            background: transparent; border: none; color: #888; cursor: pointer;
            padding: 2px 6px; font-size: 14px; line-height: 1; border-radius: 4px;
        }
        .sidebar-search-clear:hover { color: #fff; background: rgba(255,255,255,0.08); }

        .agent-list { flex: 1; overflow-y: auto; padding: 6px; }
        .agent-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
            transition: background 0.15s;
            gap: 6px;
        }
        .agent-item:hover { background: #2a2a3e; }
        .agent-item.active { background: #3a3a5e; }
        .agent-info { flex: 1; min-width: 0; }
        .agent-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .agent-meta { font-size: 11px; color: #888; margin-top: 2px; }
        .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
        .status-dot.running { background: #00b894; }
        .status-dot.exited { background: #e17055; }
        .status-dot.created { background: #fdcb6e; }
        .status-dot.restarting { background: #74b9ff; }
        .status-dot.unknown { background: #636e72; }

        .agent-actions { display: flex; gap: 2px; }
        .icon-btn {
            background: transparent; border: none; color: #888;
            cursor: pointer; padding: 4px 6px; border-radius: 4px; font-size: 13px;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .icon-btn.danger:hover { background: #e17055; color: #fff; }

        .empty-sidebar { padding: 40px 20px; text-align: center; color: #666; font-size: 13px; }

        /* Main panel */
        .main-panel { display: flex; flex-direction: column; background: #0f0f0f; min-width: 0; }
        .terminal-header {
            padding: 10px 16px; border-bottom: 1px solid #2a2a3e;
            display: flex; align-items: center; justify-content: space-between;
            font-size: 13px; color: #aaa;
            gap: 12px;
        }
        .terminal-title { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
        .terminal-title .name { color: #fff; font-weight: 500; }
        .terminal-title .badge {
            background: #2a2a3e; padding: 2px 6px; border-radius: 4px; font-size: 11px; color: #ccc;
        }
        .terminal-actions { display: flex; gap: 6px; }
        .terminal-actions button {
            background: #2a2a3e; border: 1px solid #3a3a5e; color: #ccc;
            padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
        }
        .terminal-actions button:hover { background: #3a3a5e; color: #fff; }
        .terminal-actions button:disabled { opacity: 0.35; cursor: not-allowed; }
        .terminal-actions button:disabled:hover { background: #2a2a3e; color: #ccc; }
        .terminal-container { flex: 1; position: relative; }
        .terminal-container iframe { width: 100%; height: 100%; border: none; }
        .iframe-loading {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: #0f0f0f; color: #888; font-size: 14px;
            z-index: 10;
        }
        .empty-state {
            display: flex; align-items: center; justify-content: center; height: 100%;
            color: #555; font-size: 15px;
        }

        /* Agent details */
        .details {
            border-bottom: 1px solid #2a2a3e; background: #131326;
            padding: 8px 16px; font-size: 12px;
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 18px;
            color: #bbb;
            transition: max-height 0.18s ease;
            overflow: hidden;
        }
        .details.collapsed { display: none; }
        .details .row-line { display: flex; gap: 6px; min-width: 0; }
        .details .k { color: #888; flex: 0 0 110px; }
        .details .v { color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        .details .v.muted { color: #777; font-style: italic; }
        .details-toggle { color: #888; cursor: pointer; user-select: none; font-size: 12px; }

        /* Modal */
        .modal-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.55);
            display: flex; align-items: center; justify-content: center; z-index: 100;
        }
        .modal {
            background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 10px;
            width: min(520px, 92vw); max-height: 92vh; overflow-y: auto;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid #2a2a3e; display: flex; align-items: center; justify-content: space-between; }
        .modal-header h2 { font-size: 16px; color: #fff; font-weight: 600; }
        .modal-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
        .modal-footer { padding: 12px 20px 16px; display: flex; justify-content: flex-end; gap: 8px; }
        .field label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
        .field input, .field textarea {
            width: 100%; padding: 8px 10px; border-radius: 6px;
            border: 1px solid #3a3a5e; background: #0f0f1a; color: #e0e0e0;
            font-size: 13px; outline: none; font-family: inherit;
        }
        .field input:focus, .field textarea:focus { border-color: #6c5ce7; }
        .field .hint { font-size: 11px; color: #666; margin-top: 4px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* Custom select */
        .custom-select { position: relative; }
        .select-trigger { width: 100%; min-height: 34px; padding: 7px 9px 7px 11px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid #3a3a5e; border-radius: 7px; background: linear-gradient(180deg, #151525 0%, #0f0f1a 100%); color: #e8e8ef; font: 500 13px/1.4 inherit; text-align: left; cursor: pointer; outline: none; transition: border-color .15s ease, box-shadow .15s ease, background .15s ease; }
        .select-trigger:hover { border-color: #55557a; background: #17172a; }
        .select-trigger:focus-visible, .select-trigger.open { border-color: #7c6cf2; box-shadow: 0 0 0 3px rgba(108,92,231,.18); }
        .select-trigger:disabled { opacity: .55; cursor: not-allowed; background: #11111c; }
        .select-trigger:disabled:hover { border-color: #3a3a5e; }
        .select-chevron { width: 16px; height: 16px; flex: none; color: #9292ad; transition: transform .18s ease, color .15s ease; }
        .select-trigger.open .select-chevron { transform: rotate(180deg); color: #b9b0ff; }
        .select-menu { position: absolute; z-index: 130; top: calc(100% + 6px); left: 0; right: 0; max-height: 260px; overflow-y: auto; padding: 5px; border: 1px solid #393957; border-radius: 9px; background: rgba(25,25,45,.98); box-shadow: 0 14px 36px rgba(0,0,0,.48), 0 0 0 1px rgba(255,255,255,.025) inset; backdrop-filter: blur(12px); }
        .select-search-wrap { position: relative; padding: 2px 2px 6px; }
        .select-search-icon { position: absolute; left: 11px; top: 10px; width: 14px; height: 14px; color: #777793; pointer-events: none; }
        .field .select-search {
            padding: 7px 9px 7px 30px; border-color: #343450; border-radius: 6px;
            background: #111120; font-size: 12px;
        }
        .field .select-search:focus { border-color: #6c5ce7; box-shadow: 0 0 0 2px rgba(108,92,231,.12); }
        .select-empty { padding: 14px 9px; color: #77778d; font-size: 12px; text-align: center; }
        .select-option { width: 100%; padding: 7px 9px; border: 0; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: transparent; color: #cfcfda; font: 13px/1.35 inherit; text-align: left; cursor: pointer; outline: none; }
        .select-option > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .select-option:hover, .select-option.active { background: #303052; color: #fff; }
        .select-option.selected { color: #c4bcff; font-weight: 600; }
        .select-check { width: 15px; color: #8d7ff5; font-weight: 700; text-align: center; }
        .combo-input-wrap { position: relative; }
        .field .combo-input { padding-right: 34px; }
        .combo-toggle {
            position: absolute; top: 1px; right: 1px; bottom: 1px; width: 32px;
            display: flex; align-items: center; justify-content: center;
            border: 0; border-left: 1px solid #292943; border-radius: 0 6px 6px 0;
            background: transparent; color: #9292ad; cursor: pointer;
        }
        .combo-toggle:hover { color: #c4bcff; background: rgba(108,92,231,.1); }
        .combo-toggle .select-chevron { width: 15px; height: 15px; }
        .combo-toggle.open .select-chevron { transform: rotate(180deg); color: #b9b0ff; }
        .select-placeholder { color: #666; font-weight: 400; }
        .select-menu::-webkit-scrollbar { width: 5px; }
        .select-menu::-webkit-scrollbar-thumb { background: #444467; border-radius: 3px; }
        .type-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 3px; border: 1px solid #343450; border-radius: 8px; background: #0f0f1a; }
        .type-option { padding: 7px 10px; border: 0; border-radius: 5px; background: transparent; color: #8888a1; font: 500 13px/1.3 inherit; cursor: pointer; transition: background .15s ease, color .15s ease, box-shadow .15s ease; }
        .type-option:hover { color: #ddd; background: rgba(255,255,255,.04); }
        .type-option.active { color: #fff; background: #39345f; box-shadow: 0 1px 4px rgba(0,0,0,.28); }
        .btn-primary {
            background: #6c5ce7; color: #fff; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;
        }
        .btn-primary:hover { background: #5a4bd1; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary {
            background: transparent; color: #ccc; border: 1px solid #3a3a5e;
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        .btn-secondary:hover { background: #2a2a3e; color: #fff; }

        /* Env var editor */
        .env-list { display: flex; flex-direction: column; gap: 6px; }
        .env-row { display: grid; grid-template-columns: 1fr 1.6fr auto; gap: 6px; align-items: center; }
        .env-row input { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        .env-row .icon-btn { padding: 4px 8px; }
        .env-add {
            background: transparent; color: #6c5ce7; border: 1px dashed #3a3a5e;
            padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
            margin-top: 4px;
        }
        .env-add:hover { background: #2a2a3e; color: #fff; border-color: #6c5ce7; }
        .env-row.invalid input { border-color: #e17055; }

        /* Scrollbar */
        .agent-list::-webkit-scrollbar, .modal::-webkit-scrollbar { width: 6px; }
        .agent-list::-webkit-scrollbar-thumb, .modal::-webkit-scrollbar-thumb { background: #3a3a5e; border-radius: 3px; }
    </style>
</head>
<body>
<div class="app" :class="{ collapsed: collapsed }" x-data="agentApp()">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <button class="btn-toggle" @click="collapsed = !collapsed" :title="collapsed ? 'Expand' : 'Collapse'">
                <span x-text="collapsed ? '»' : '«'"></span>
            </button>
            <h1 x-show="!collapsed">Agent Runner</h1>
            <button class="btn-new" @click="openCreate()" title="Create agent">+</button>
        </div>
        <div class="sidebar-search">
            <div class="sidebar-search-input-wrap">
                <input type="text" x-model="searchQuery" @keydown.escape="searchQuery = ''"
                       placeholder="Search agents…" />
                <button class="sidebar-search-clear" @click="searchQuery = ''"
                        x-show="searchQuery" title="Clear">✕</button>
            </div>
        </div>
        <div class="agent-list">
            <template x-if="filteredAgents.length === 0">
                <div class="empty-sidebar">
                    <template x-if="agents.length === 0">
                        <span>No agents yet.<br>Click + to create one.</span>
                    </template>
                    <template x-if="agents.length > 0">
                        <span>No agents match "<span x-text="searchQuery"></span>"</span>
                    </template>
                </div>
            </template>
            <template x-for="agent in filteredAgents" :key="agent.id">
                <div class="agent-item" :class="{ active: selectedId === agent.id }"
                     @click="selectAgent(agent)">
                    <div class="agent-info">
                        <div class="agent-name" x-text="agent.name"></div>
                        <div class="agent-meta">
                            <span class="status-dot" :class="agent.status"></span>
                            <span x-text="agent.status"></span>
                            <template x-if="agent.variant">
                                <span> · <span x-text="agent.variant"></span></span>
                            </template>
                            <span> · <span x-text="agent.agentType || 'claude'"></span></span>
                            <template x-if="agent.agentId">
                                <span> · <span x-text="agent.agentId"></span></span>
                            </template>
                            <template x-if="agent.projectId">
                                <span> · <span x-text="agent.projectId"></span></span>
                            </template>
                        </div>
                    </div>
                    <div class="agent-actions">
                        <button class="icon-btn" @click.stop="openEdit(agent)" title="Edit config">⚙</button>
                        <button class="icon-btn" @click.stop="restartAgent(agent)" title="Restart">↻</button>
                        <button class="icon-btn danger" @click.stop="deleteAgent(agent.id)" title="Delete">✕</button>
                    </div>
                </div>
            </template>
        </div>
    </aside>

    <!-- Main panel -->
    <main class="main-panel">
        <template x-if="selectedAgent">
            <div style="display: flex; flex-direction: column; height: 100%;">
                <div class="terminal-header">
                    <div class="terminal-title">
                        <span class="name" x-text="selectedAgent.name"></span>
                        <span class="badge" x-text="selectedAgent.status"></span>
                        <span class="badge" x-text="selectedAgent.agentType || 'claude'"></span>
                        <template x-if="selectedAgent.variant">
                            <span class="badge" x-text="selectedAgent.variant"></span>
                        </template>
                        <template x-if="selectedAgent.agentId">
                            <span class="badge" x-text="'agent: ' + selectedAgent.agentId"></span>
                        </template>
                        <template x-if="selectedAgent.projectId">
                            <span class="badge" x-text="'project: ' + selectedAgent.projectId"></span>
                        </template>
                        <span class="details-toggle" @click="detailsOpen = !detailsOpen"
                              x-text="detailsOpen ? '▾ details' : '▸ details'"></span>
                    </div>
                    <div class="terminal-actions">
                        <button @click="startAgent(selectedAgent)" :disabled="isRunning(selectedAgent)">Start</button>
                        <button @click="stopAgent(selectedAgent)" :disabled="!isRunning(selectedAgent)">Stop</button>
                        <button @click="openEdit(selectedAgent)">Edit</button>
                        <button @click="restartAgent(selectedAgent)">Restart</button>
                        <button @click="deleteAgent(selectedAgent.id)">Delete</button>
                    </div>
                </div>
                <div class="details" :class="{ collapsed: !detailsOpen }">
                    <div class="row-line"><span class="k">Image</span><span class="v" x-text="selectedAgent.image || '—'"></span></div>
                    <div class="row-line"><span class="k">AGENT_ID</span><span class="v" x-text="selectedAgent.agentId || '—'"></span></div>
                    <div class="row-line"><span class="k">AGENT_TYPE</span><span class="v" x-text="selectedAgent.agentType || 'claude'"></span></div>
                    <div class="row-line"><span class="k">Project ID</span><span class="v" x-text="selectedAgent.projectId || '—'"></span></div>
                    <div class="row-line"><span class="k">Worktree</span><span class="v" x-text="selectedAgent.workspaceId || '(none)'"></span></div>
                    <div class="row-line"><span class="k">Container -w</span><span class="v" x-text="containerWorkdir(selectedAgent)"></span></div>
                    <div class="row-line"><span class="k">PROJECT_HOME</span><span class="v" x-text="selectedAgent.projectHome || '—'"></span></div>
                    <div class="row-line"><span class="k">CLAUDE_CONFIG</span><span class="v" x-text="selectedAgent.claudeConfig || '—'"></span></div>
                    <div class="row-line"><span class="k">CLAUDE_HOME</span><span class="v" x-text="selectedAgent.claudeHome || '—'"></span></div>
                    <div class="row-line"><span class="k">CODEX_HOME</span><span class="v" x-text="selectedAgent.codexHome || '—'"></span></div>
                    <div class="row-line"><span class="k">AGENTS_HOME</span><span class="v" x-text="selectedAgent.agentsHome || '—'"></span></div>
                    <div class="row-line"><span class="k">AGENTS_HUB</span><span class="v" x-text="selectedAgent.agentsHub || '—'"></span></div>
                    <div class="row-line"><span class="k">Agent args</span><span class="v" x-text="(selectedAgent.agentArgs || selectedAgent.claudeArgs || []).join(' ') || '(default)'"></span></div>
                    <div class="row-line"><span class="k">Extra env</span><span class="v" :class="{ muted: !(selectedAgent.extraEnv && selectedAgent.extraEnv.length) }" x-text="formatExtraEnv(selectedAgent.extraEnv)"></span></div>
                    <div class="row-line"><span class="k">Auth override</span><span class="v" :class="{ muted: !selectedAgent.hasAuthOverride }" x-text="selectedAgent.hasAuthOverride ? 'yes' : 'no (runner default)'"></span></div>
                    <div class="row-line"><span class="k">Base URL ovr</span><span class="v" :class="{ muted: !selectedAgent.hasBaseOverride }" x-text="selectedAgent.hasBaseOverride ? 'yes' : 'no (runner default)'"></span></div>
                </div>
                <div class="terminal-container">
                    <template x-if="iframeLoading">
                        <div class="iframe-loading">Starting terminal...</div>
                    </template>
                    <iframe x-ref="terminal" :src="selectedAgent.ttydUrl"
                            @load="iframeLoading = false; patchIframe($event)"
                            @error="iframeLoading = false"></iframe>
                </div>
            </div>
        </template>
        <template x-if="!selectedAgent">
            <div class="empty-state">Select or create an agent</div>
        </template>
    </main>

    <!-- Create / edit modal -->
    <template x-if="modalOpen">
        <div class="modal-backdrop" @click.self="closeModal()">
            <div class="modal">
                <div class="modal-header">
                    <h2 x-text="modalMode === 'edit' ? 'Edit Agent' : 'Create Agent'"></h2>
                    <button class="icon-btn" @click="closeModal()">✕</button>
                </div>
                <div class="modal-body">
                    <div class="field">
                        <label>Name</label>
                        <input type="text" x-model="form.name" placeholder="auto-generated if empty"
                               :disabled="modalMode === 'edit'" />
                        <div class="hint" x-show="modalMode === 'edit'">Name can't be changed.</div>
                    </div>
                    <div class="field">
                        <label>AGENT_TYPE</label>
                        <div class="type-selector" role="radiogroup" aria-label="Agent type">
                            <button type="button" class="type-option" role="radio"
                                    :class="{ active: form.agentType === 'claude' }"
                                    :aria-checked="form.agentType === 'claude'"
                                    @click="form.agentType = 'claude'">Claude</button>
                            <button type="button" class="type-option" role="radio"
                                    :class="{ active: form.agentType === 'codex' }"
                                    :aria-checked="form.agentType === 'codex'"
                                    @click="form.agentType = 'codex'">Codex</button>
                        </div>
                        <div class="hint" x-text="form.agentType === 'codex' ? 'Starts Codex CLI in the web terminal.' : 'Starts Claude CLI in the web terminal.'"></div>
                    </div>
                    <div class="row">
                        <div class="field">
                            <label>Image variant</label>
                            <div class="custom-select"
                                 x-data="{
                                     open: false,
                                     active: 0,
                                     query: '',
                                     filteredVariants() {
                                         const query = this.query.trim().toLowerCase();
                                         return query ? this.variants.filter(v => v.toLowerCase().includes(query)) : this.variants;
                                     },
                                     openMenu() {
                                         this.query = '';
                                         this.active = Math.max(0, this.variants.indexOf(this.form.variant));
                                         this.open = true;
                                     },
                                     move(delta) {
                                         if (!this.open) this.openMenu();
                                         const options = this.filteredVariants();
                                         if (!options.length) return;
                                         this.active = (this.active + delta + options.length) % options.length;
                                     },
                                     choose(variant) {
                                         if (!variant) return;
                                         this.form.variant = variant;
                                         this.open = false;
                                     }
                                 }"
                                 @click.outside="open = false">
                                <button type="button" class="select-trigger"
                                        :class="{ open: open }" aria-haspopup="listbox"
                                        :aria-expanded="open" aria-controls="variant-options"
                                        @click="if (open) { open = false } else { openMenu(); $nextTick(() => $refs.variantSearch.focus()) }"
                                        @keydown.down.prevent="move(1)" @keydown.up.prevent="move(-1)"
                                        @keydown.home.prevent="openMenu(); active = 0"

                                    </div>

                                    <div class="hint">Default: <code x-text="defaultClaudeHome()"></code> &nbsp;→&nbsp; mounts to <code>/home/node/.claude</code></div>
                                </div>

                                    <div class="hint">Default: <code x-text="defaultCodexHome()"></code> &nbsp;→&nbsp; mounts to <code>/home/node/.codex</code></div>
                                </div>

                                </div>

                                    <div class="hint">Default: <code x-text="defaultAgentsHub()"></code> &nbsp;→&nbsp; mounts to <code>/home/node/.agents-hub</code></div>

<script>
function agentApp() {
    return {
        agents: [],
        selectedId: null,
        selectedAgent: null,
        iframeLoading: false,
        collapsed: false,
        searchQuery: '',
        refreshTimer: null,

        cfg: {
            hostHome: '',
            agentId: 'default',
            projectRoot: '/data/work',
            projectHome: '',
            claudeHome: '',
            codexHome: '',
            agentsHome: '',
            agentsHub: '',
            claudeConfig: '',
            imageRegistry: '',
            imageTag: 'latest',
            hasAuthDefault: false,
            hasBaseUrlDefault: false,
            anthropicBaseUrl: '',
        },

        variants: ['default', 'java8', 'java17', 'java21', 'java25'],

        listAgentIds: [],
        listProjects: [],
        listWorkspaces: [],

        modalOpen: false,
        modalMode: 'create',
        submitting: false,
        advancedOpen: false,
        detailsOpen: false,
        form: {
            id: null,
            name: '',
            agentId: '',
            agentType: 'claude',
            variant: 'default',
            projectId: '',
            workspaceId: '',
            projectHome: '',
            claudeHome: '',
            codexHome: '',
            agentsHome: '',
            agentsHub: '',
            claudeConfig: '',
            claudeArgsText: '',
            anthropicAuthToken: '',
            anthropicBaseUrl: '',
            extraEnv: [],
        },

        blankForm() {
            return {
                id: null,
                name: '',
                agentId: '',
                agentType: 'claude',
                variant: 'default',
                projectId: '',
                workspaceId: '',
                projectHome: '',
                claudeHome: '',
                codexHome: '',
                agentsHome: '',
                agentsHub: '',
                claudeConfig: '',
                claudeArgsText: '',
                anthropicAuthToken: '',
                anthropicBaseUrl: '',
                extraEnv: [],
            };
        },

        async init() {
            this.form = this.blankForm();
            await this.loadConfig();
            await Promise.all([this.refreshAgents(), this.fetchListOptions()]);
            this.applyHashSelection();
            window.addEventListener('hashchange', () => this.onHashChange());
            this.refreshTimer = setInterval(() => this.refreshAgents(), 5000);
        },

        async loadConfig() {
            try {
                const resp = await fetch('/api/config');
                if (resp.ok) {
                    const data = await resp.json();
                    this.cfg = { ...this.cfg, ...data };
                }
            } catch (e) {
                console.error('load config error:', e);
            }
        },

        async fetchListOptions() {
            try {
                const [r1, r2] = await Promise.all([
                    fetch('/api/lists/agents'),
                    fetch('/api/lists/projects'),
                ]);
                if (r1.ok) this.listAgentIds = (await r1.json()).items || [];
                if (r2.ok) this.listProjects = (await r2.json()).items || [];
            } catch (e) {
                console.error('fetch list options error:', e);
            }
        },

        // waitTtydReady polls the agent's proxied ttyd URL until it returns the
        // ttyd HTML page. This is the correct readiness signal: Docker reports a
        // container "running" as soon as it starts, BEFORE ttyd has bound port
        // 7681, so checking container status alone races the iframe load and
        // the iframe ends up showing a 502 "agent terminal unavailable" page.
        async waitTtydReady(id, maxRetries = 30, delayMs = 1000) {
            const url = '/proxy/' + id + '/';
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const resp = await fetch(url);
                    if (resp.ok && (resp.headers.get('content-type') || '').includes('text/html')) {
                        return true;
                    }
                } catch (e) {}
                await new Promise(r => setTimeout(r, delayMs));
            }
            return false;
        },

        // reloadTerminal forces the ttyd iframe to navigate again so its @load
        // fires and clears the "Starting terminal..." overlay. Alpine's :src
        // binding only re-navigates when the URL string CHANGES, so for a
        // restart/start of the SAME agent (unchanged /proxy/{id}/ URL) we must
        // reload imperatively. (:key="iframeKey" does NOT recreate a standalone
        // element in Alpine v3 — only x-for consumes _x_keyExpression; on a
        // plain element :key just calls setAttribute('key', n), a no-op.)
        reloadTerminal() {
            this.suppressBeforeUnload();
            this.iframeLoading = true;
            this.$nextTick(() => this.forceIframeReload());
        },

        forceIframeReload() {
            const f = this.$refs.terminal;
            if (!f || !f.contentWindow || !this.selectedAgent) return;
            const desired = this.selectedAgent.ttydUrl;
            let cur = '';
            try {
                const l = f.contentWindow.location;
                cur = l.pathname + l.search;
            } catch (e) {
                return; // cross-origin — shouldn't happen, the proxy is same-origin
            }
            // Only force-reload when the iframe is already on the desired URL;
            // otherwise a :src change is already navigating it and @load will fire.
            if (cur === desired) {
                try { f.contentWindow.location.reload(); } catch (e) {}
            }
        },

        async fetchWorkspaces() {
            const pid = (this.form.projectId || '').trim();
            if (!pid) { this.listWorkspaces = []; return; }
            try {
                const resp = await fetch('/api/lists/workspaces?projectId=' + encodeURIComponent(pid));
                if (resp.ok) this.listWorkspaces = (await resp.json()).items || [];
            } catch (e) {
                this.listWorkspaces = [];
            }
        },

        defaultProjectHome() {
            if (this.cfg.projectHome) return this.cfg.projectHome;
            const pid = (this.form.projectId || '').trim() || '${PROJECT_ID}';
            return (this.cfg.projectRoot || '/data/work') + '/' + pid;
        },
        defaultClaudeHome() {
            return this.cfg.claudeHome || ((this.cfg.hostHome || '~') + '/.claude');
        },
        defaultCodexHome() {
            return this.cfg.codexHome || ((this.cfg.hostHome || '~') + '/.codex');
        },
        defaultAgentsHome() {
            return this.cfg.agentsHome || ((this.cfg.hostHome || '~') + '/.agents');
        },
        defaultAgentsHub() {
            return this.cfg.agentsHub || ((this.cfg.hostHome || '~') + '/.agents-hub');
        },
        defaultClaudeConfig() {
            return this.cfg.claudeConfig || ((this.cfg.hostHome || '~') + '/.claude.json');
        },

        addEnv() {
            this.form.extraEnv.push({ key: '', value: '', _invalid: false });
        },
        removeEnv(idx) {
            this.form.extraEnv.splice(idx, 1);
        },
        formatExtraEnv(list) {
            if (!list || list.length === 0) return '(none)';
            return list.map(e => e.key + (e.value ? '=' + e.value : '=')).join(' · ');
        },
        envKeyValid(key) {
            return /^[A-Za-z_][A-Za-z0-9_]*$/.test(key);
        },

        get filteredAgents() {
            const q = (this.searchQuery || '').trim().toLowerCase();
            if (!q) return this.agents;
            return this.agents.filter(a => {
                const hay = [
                    a.name, a.agentId, a.agentType, a.projectId, a.workspaceId, a.variant, a.status,
                ].filter(Boolean).join(' ').toLowerCase();
                return hay.includes(q);
            });
        },

        async refreshAgents() {
            try {
                const resp = await fetch('/api/agents');
                const data = await resp.json();
                this.agents = data.agents || [];
                if (this.selectedId) {
                    const found = this.agents.find(a => a.id === this.selectedId);
                    if (found) {
                        // preserve iframe by not reassigning if url unchanged
                        if (!this.selectedAgent || this.selectedAgent.ttydUrl !== found.ttydUrl) {
                            this.suppressBeforeUnload();
                            this.selectedAgent = found;
                        } else {
                            this.selectedAgent = { ...found, ttydUrl: this.selectedAgent.ttydUrl };
                        }
                    } else {
                        this.suppressBeforeUnload();
                        this.selectedId = null;
                        this.selectedAgent = null;
                        this.setHashId(null);
                    }
                }
            } catch (e) {
                console.error('refresh error:', e);
            }
        },

        suppressBeforeUnload() {
            const iframe = document.querySelector('.terminal-container iframe');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.onbeforeunload = null;
            }
        },

        patchIframe(event) {
            const cw = event.target.contentWindow;
            if (!cw) return;
            // Clear any existing beforeunload handler
            cw.onbeforeunload = null;
            // Monkey-patch addEventListener to ignore beforeunload registrations
            const orig = cw.addEventListener;
            cw.addEventListener = function(type, fn, opts) {
                if (type === 'beforeunload') return;
                return orig.call(this, type, fn, opts);
            };
        },

        selectAgent(agent) {
            this.suppressBeforeUnload();
            this.selectedId = agent.id;
            this.selectedAgent = agent;
            this.reloadTerminal();
            this.setHashId(agent.id);
        },

        // ---- Hash router ----------------------------------------------------
        // Selection is mirrored to window.location.hash as `#/agent/{id}` so
        // that a browser refresh (or sharing a URL) restores the chosen
        // agent. We use history.replaceState to avoid polluting back history
        // for routine clicks; the hashchange listener only fires for genuine
        // navigation (back/forward, manual hash edit, or programmatic
        // location.hash assignment from outside).
        parseHashId() {
            const m = /^#\/agent\/([^/?#]+)$/.exec(window.location.hash);
            return m ? m[1] : null;
        },
        setHashId(id) {
            const target = id ? '#/agent/' + id : '';
            if (window.location.hash === target) return;
            const url = window.location.pathname + window.location.search + target;
            history.replaceState(null, '', url);
        },
        applyHashSelection() {
            const id = this.parseHashId();
            if (!id) return;
            const found = this.agents.find(a => a.id === id);
            if (found) {
                this.selectAgent(found);
            } else {
                // Hash points at an agent that no longer exists (deleted in
                // another tab, server reset, etc.). Drop the stale id so the
                // user is not stuck with a dead URL.
                this.setHashId(null);
            }
        },
        onHashChange() {
            const id = this.parseHashId();
            if (id === this.selectedId) return;
            if (!id) {
                this.suppressBeforeUnload();
                this.selectedId = null;
                this.selectedAgent = null;
                return;
            }
            const found = this.agents.find(a => a.id === id);
            if (found) this.selectAgent(found);
        },

        containerWorkdir(agent) {
            if (!agent || !agent.projectId) return '—';
            const base = '/workspace/' + agent.projectId;
            return agent.workspaceId ? base + '/' + agent.workspaceId : base;
        },

        openCreate() {
            this.form = this.blankForm();
            this.listWorkspaces = [];
            this.advancedOpen = false;
            this.modalMode = 'create';
            this.modalOpen = true;
        },

        openEdit(agent) {
            this.form = {
                id: agent.id,
                name: agent.name || '',
                agentId: agent.agentId || '',
                agentType: agent.agentType || 'claude',
                variant: ['go', 'rust'].includes(agent.variant) ? 'default' : (agent.variant || 'default'),
                projectId: agent.projectId || '',
                workspaceId: agent.workspaceId || '',
                projectHome: agent.projectHome || '',
                claudeHome: agent.claudeHome || '',
                codexHome: agent.codexHome || '',
                agentsHome: agent.agentsHome || '',
                agentsHub: agent.agentsHub || '',
                claudeConfig: agent.claudeConfig || '',
                claudeArgsText: (agent.claudeArgs || []).join(' '),
                anthropicAuthToken: '',
                anthropicBaseUrl: '',
                extraEnv: (agent.extraEnv || []).map(e => ({ key: e.key, value: e.value, _invalid: false })),
            };
            this.fetchWorkspaces();
            this.advancedOpen = false;
            this.modalMode = 'edit';
            this.modalOpen = true;
        },

        closeModal() {
            if (this.submitting) return;
            this.modalOpen = false;
        },

        buildPayload() {
            const claudeArgs = (this.form.claudeArgsText || '')
                .split(/\s+/)
                .map(s => s.trim())
                .filter(Boolean);
            const extraEnv = [];
            const seen = {};
            for (const e of this.form.extraEnv) {
                const key = (e.key || '').trim();
                if (!key) continue;
                if (!this.envKeyValid(key) || seen[key]) {
                    e._invalid = true;
                    throw new Error('Invalid or duplicate env var key: ' + JSON.stringify(e.key));
                }
                seen[key] = true;
                e._invalid = false;
                extraEnv.push({ key, value: e.value || '' });
            }
            const payload = {
                agentType: this.form.agentType,
                variant: this.form.variant === 'default' ? '' : this.form.variant,
                agentId: this.form.agentId.trim(),
                projectId: this.form.projectId.trim(),
                workspaceId: this.form.workspaceId.trim(),
                projectHome: this.form.projectHome.trim(),
                claudeHome: this.form.claudeHome.trim(),
                codexHome: this.form.codexHome.trim(),
                agentsHome: this.form.agentsHome.trim(),
                agentsHub: this.form.agentsHub.trim(),
                claudeConfig: this.form.claudeConfig.trim(),
                agentArgs: claudeArgs,
                extraEnv,
            };
            if (this.form.name.trim()) payload.name = this.form.name.trim();
            if (this.form.anthropicAuthToken) payload.anthropicAuthToken = this.form.anthropicAuthToken;
            if (this.form.anthropicBaseUrl) payload.anthropicBaseUrl = this.form.anthropicBaseUrl.trim();
            return payload;
        },

        async submitModal() {
            this.submitting = true;
            let payload;
            try {
                payload = this.buildPayload();
            } catch (e) {
                alert(e.message || 'Invalid form');
                this.submitting = false;
                return;
            }
            try {
                let resp;
                if (this.modalMode === 'edit') {
                    resp = await fetch('/api/agents/' + this.form.id, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                    });
                } else {
                    resp = await fetch('/api/agents', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                    });
                }
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    alert(err.error || ('Request failed: ' + resp.status));
                    return;
                }
                const result = await resp.json();
                this.modalOpen = false;
                // Poll until ttyd is actually serving (container "running" alone
                // is not enough — see waitTtydReady).
                const ready = await this.waitTtydReady(result.id, 30, 1000);
                await this.refreshAgents();
                const fresh = this.agents.find(a => a.id === result.id) || result;
                if (fresh) this.selectAgent(fresh);
                // If still not ready, retry the iframe load after a short delay
                if (!ready) {
                    setTimeout(() => { this.reloadTerminal(); }, 2000);
                }
            } catch (e) {
                console.error(e);
                alert('Network error');
            } finally {
                this.submitting = false;
            }
        },

        async restartAgent(agent) {
            if (!confirm('Restart agent "' + agent.name + '"? Existing ' + (agent.agentType || 'claude') + ' session will be killed.')) return;
            try {
                const resp = await fetch('/api/agents/' + agent.id + '/restart', { method: 'POST' });
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    alert(err.error || 'Restart failed');
                    return;
                }
                await this.refreshAgents();
                await this.waitTtydReady(agent.id, 30, 1000);
                this.reloadTerminal();
            } catch (e) {
                alert('Network error');
            }
        },

        isRunning(agent) {
            return !!agent && agent.status === 'running';
        },

        async startAgent(agent) {
            try {
                const resp = await fetch('/api/agents/' + agent.id + '/start', { method: 'POST' });
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    alert(err.error || 'Start failed');
                    return;
                }
                await this.refreshAgents();
                await this.waitTtydReady(agent.id, 30, 1000);
                this.reloadTerminal();
            } catch (e) {
                alert('Network error');
            }
        },

        async stopAgent(agent) {
            if (!confirm('Stop agent "' + agent.name + '"? The container is stopped but not removed — Start brings it back.')) return;
            try {
                const resp = await fetch('/api/agents/' + agent.id + '/stop', { method: 'POST' });
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    alert(err.error || 'Stop failed');
                    return;
                }
                await this.refreshAgents();
            } catch (e) {
                alert('Network error');
            }
        },

        async deleteAgent(id) {
            if (!confirm('Delete this agent? The container and its node_home volume will be removed.')) return;
            try {
                await fetch('/api/agents/' + id, { method: 'DELETE' });
                if (this.selectedId === id) {
                    this.suppressBeforeUnload();
                    this.selectedId = null;
                    this.selectedAgent = null;
                    this.setHashId(null);
                }
                await this.refreshAgents();
            } catch (e) {
                alert('Failed to delete agent');
            }
        },
    };
}
</script>
</body>
</html>
